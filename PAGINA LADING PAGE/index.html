<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Interactiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="contenedor">
            <!-- Añadido ID a la imagen del logo -->
            <img id="logo-img" src="iMAG2.png" alt="Logo de la empresa" width="150">
            <!-- Agrupador para elementos derechos del header -->
            <div class="header-derecha">
                <nav>
                    <ul>
                        <li><a href="#">Inicio</a></li>
                        <li><a href="#">Servicios</a></li>
                        <li><a href="#formulario-contacto">Contacto</a></li>
                    </ul>
                </nav>
                <button id="theme-toggle" aria-label="Cambiar tema de color">🌙</button>
            </div>
        </div>
    </header>

    <section class="presentacion">
        <div class="contenedor">
            <div class="presentacion-texto"> <!-- Mantenemos el div para el texto si lo usamos en CSS -->
                <h1>Bienvenido a Nuestra Landing Page</h1>
                <p>Descubre nuestros servicios y ponte en contacto con nosotros.</p>
            </div>
            <!-- Añadido ID a la imagen de presentación -->
            <img id="presentacion-img" src="iMAG2.png" alt="Imagen de presentación" class="presentacion-imagen" width="600"> <!-- Mantenemos clase si la usamos -->
        </div>
    </section>

    <section id="formulario-contacto" class="seccion-formulario">
        <div class="contenedor">
            <h2>Contáctanos</h2>
            <form id="miFormulario">
                <div class="campo-formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                    <span class="mensaje-error" aria-describedby="nombre"></span>
                </div>
                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tu.email@ejemplo.com" required>
                    <span class="mensaje-error" aria-describedby="email"></span>
                </div>
                <div class="campo-formulario">
                    <label for="asunto">Asunto:</label>
                    <select id="asunto" name="asunto">
                        <option value="consulta">Consulta General</option>
                        <option value="soporte">Soporte Técnico</option>
                        <option value="ventas">Ventas</option>
                    </select>
                </div>
                <div class="campo-formulario">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí" required maxlength="200"></textarea>
                    <span class="mensaje-error" aria-describedby="mensaje"></span>
                </div>
                <button type="submit">Enviar Mensaje</button>
            </form>
            <div id="mensaje-exito" class="mensaje-exito" style="display: none;">
                ¡Gracias por tu mensaje! Nos pondremos en contacto contigo pronto.
                <button id="enviar-otro-formulario" type="button">Enviar Otro Formulario</button>
            </div>
        </div>
    </section>

    <footer>
        <div class="contenedor">
            <p>soy un footer derechos reservados para el ale </p>
            <p>Contacto: aolea2021@alu.uct.cl</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
